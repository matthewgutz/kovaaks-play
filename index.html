<!DOCTYPE html>
<html>
<head>
    <meta charset="utf-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Launching Kovaak's</title>
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Outfit:wght@300;400;600;700&display=swap" rel="stylesheet">
    <style>
        body {
            background-color: #121214;
            color: #ffffff;
            font-family: 'Outfit', sans-serif;
            display: flex;
            align-items: center;
            justify-content: center;
            height: 100vh;
            margin: 0;
            overflow: hidden;
        }
        .container {
            text-align: center;
            padding: 40px 30px;
            background: rgba(255, 255, 255, 0.03);
            border-radius: 20px;
            border: 1px solid rgba(255, 255, 255, 0.08);
            backdrop-filter: blur(16px);
            -webkit-backdrop-filter: blur(16px);
            max-width: 420px;
            width: 90%;
            box-shadow: 0 20px 50px rgba(0, 0, 0, 0.3);
            animation: fadeIn 0.6s ease-out;
        }
        @keyframes fadeIn {
            from { opacity: 0; transform: translateY(20px); }
            to { opacity: 1; transform: translateY(0); }
        }
        .icon {
            font-size: 3.5rem;
            margin-bottom: 20px;
            display: inline-block;
            animation: float 3s ease-in-out infinite;
        }
        @keyframes float {
            0%, 100% { transform: translateY(0); }
            50% { transform: translateY(-10px); }
        }
        h2 {
            margin: 0 0 10px 0;
            font-weight: 700;
            background: linear-gradient(135deg, #00f2fe 0%, #4facfe 100%);
            -webkit-background-clip: text;
            -webkit-text-fill-color: transparent;
        }
        .desc {
            color: #9fa6b2;
            font-size: 0.95rem;
            line-height: 1.6;
            margin: 0 0 25px 0;
        }
        .scenario {
            display: block;
            margin-top: 8px;
            color: #ffffff;
            font-size: 1.15rem;
            font-weight: 600;
            word-break: break-word;
            padding: 8px 12px;
            background: rgba(255, 255, 255, 0.04);
            border-radius: 8px;
            border: 1px solid rgba(255, 255, 255, 0.04);
        }
        .btn {
            display: inline-block;
            padding: 12px 24px;
            background: linear-gradient(135deg, #00f2fe 0%, #4facfe 100%);
            color: #121214;
            text-decoration: none;
            font-weight: 600;
            border-radius: 10px;
            transition: all 0.2s ease;
            box-shadow: 0 4px 15px rgba(0, 242, 254, 0.3);
        }
        .btn:hover {
            transform: translateY(-2px);
            box-shadow: 0 6px 20px rgba(0, 242, 254, 0.4);
        }
        .footer {
            font-size: 0.8rem;
            color: #525866;
            margin-top: 30px;
        }
    </style>
</head>
<body>
    <div class="container">
        <div class="icon">🎮</div>
        <h2>Launching Kovaak's</h2>
        <div class="desc">
            Attempting to launch the scenario:
            <span id="scenario-name" class="scenario">Loading...</span>
        </div>
        <a id="direct-link" class="btn" href="#">Launch Manually</a>
        <div class="footer">
            If prompted by your browser, check the box to allow launching the application.
        </div>
    </div>

    <script>
        // Parse the scenario name from query parameters
        const params = new URLSearchParams(window.location.search);
        const scenName = params.get('scenario') || 'WhisphereRawControl';
        document.getElementById('scenario-name').textContent = scenName;
        
        // Construct the Steam launch URI
        const playUrl = 'steam://run/824270/?action=jump-to-scenario;name=' + encodeURIComponent(scenName);
        document.getElementById('direct-link').href = playUrl;
        
        // Auto-redirect browser to the Steam protocol link
        window.location.href = playUrl;
        
        // Automatically close the window/tab after 4 seconds (if the browser allows it)
        setTimeout(function() {
            window.close();
        }, 4000);
    </script>
</body>
</html>
